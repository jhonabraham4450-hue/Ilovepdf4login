<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - iLovePDF4</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box{
  background:#fff;
  padding:28px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 30px #0001;
}
h1{
  text-align:center;
  color:#222;
}
input,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  box-sizing:border-box;
  border-radius:10px;
}
input{
  border:1px solid #ddd;
}
button{
  border:0;
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
a{
  color:#e53935;
  text-decoration:none;
  font-weight:bold;
}
.msg{
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h1>iLovePDF4 Admin</h1>

<p>Admin account দিয়ে প্রবেশ করুন</p>

<form onsubmit="adminLogin(event)">

<input
  id="adminId"
  placeholder="Admin ID"
  required
>

<input
  id="adminPassword"
  type="password"
  placeholder="Admin Password"
  required
>

<button type="submit">Admin Login</button>

</form>

<p style="text-align:center">
<a href="/login.html">Back to User Login</a>
</p>

<div id="msg" class="msg"></div>

</div>

<script>
async function adminLogin(e){

  e.preventDefault();

  const msg=document.getElementById("msg");

  msg.style.color="#333";
  msg.textContent="Login হচ্ছে...";

  try{

    const r=await fetch("/api/admin-login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        adminId:document.getElementById("adminId").value.trim(),
        password:document.getElementById("adminPassword").value
      })
    });

    const data=await r.json();

    if(data.ok){

      location="/admin-dashboard.html";

    }else{

      msg.style.color="#d92d20";
      msg.textContent=data.error || "Admin login failed.";

    }

  }catch(err){

    msg.style.color="#d92d20";
    msg.textContent="Server error. আবার চেষ্টা করুন।";

  }
}
</script>

</body>
</html>
