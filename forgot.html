<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - iLovePDF4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #e5322d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #e5322d;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c92520;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #e5322d;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>iLovePDF4</h1>

    <div class="subtitle">
      Forgot your password?
    </div>

    <form id="forgotForm">

      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        required
      >

      <button type="submit">
        Continue
      </button>

    </form>

    <div id="message"></div>

    <a class="login-link" href="login.html">
      Back to Login
    </a>

  </div>

  <script>
    const forgotForm = document.getElementById("forgotForm");
    const message = document.getElementById("message");

    forgotForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();

      message.textContent = "";
      message.style.color = "";

      try {
        const response = await fetch("/api/forgot", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username
          })
        });

        const data = await response.json();

        if (data.success) {
          message.textContent = "Username verified. Opening reset page...";
          message.style.color = "green";

          setTimeout(() => {
            window.location.href =
              "reset.html?username=" +
              encodeURIComponent(username);
          }, 1000);

        } else {
          message.textContent =
            data.message || "Username verification failed.";
          message.style.color = "red";
        }

      } catch (error) {
        message.textContent = "Server connection failed.";
        message.style.color = "red";
      }
    });
  </script>

</body>
</html>
