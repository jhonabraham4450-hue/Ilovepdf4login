<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLovePDF4 - Login</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}
h1{
    text-align:center;
    color:#e5322d;
}
p{
    text-align:center;
    color:#666;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:7px;
}
button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:7px;
    background:#e5322d;
    color:white;
    font-size:16px;
}
a{
    color:#e5322d;
    text-decoration:none;
    font-weight:bold;
}
.center{
    text-align:center;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

<h1>iLovePDF4</h1>
<p>আপনার account দিয়ে প্রবেশ করুন</p>

<form onsubmit="loginUser(event)">

<input type="text" id="username" placeholder="User ID" required>

<input type="password" id="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div class="center">
New user?
<a href="register.html">Register</a>
</div>

</div>

<script>
function loginUser(event){

event.preventDefault();

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;

const savedUser =
localStorage.getItem("ilovepdf4_user");

const savedPassword =
localStorage.getItem("ilovepdf4_password");

if(username === savedUser && password === savedPassword){

window.location.href="home.html";

}else{

alert("Invalid User ID or Password");

}

}
</script>

</body>
</html>
