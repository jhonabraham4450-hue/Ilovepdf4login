<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iLovePDF4 Login</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box{
  background:white;
  padding:28px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 30px #0001;
}
h1{
  text-align:center;
  color:#e53935;
}
input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:10px;
}
input{
  border:1px solid #ddd;
}
button{
  border:0;
  background:#e53935;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
a{
  color:#e53935;
  font-weight:bold;
  text-decoration:none;
}
.msg{
  text-align:center;
  color:#d92d20;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h1>iLovePDF4</h1>

<p>Login করুন</p>

<form onsubmit="go(event)">

<input
  id="i"
  placeholder="Email/Gmail বা Mobile"
  required
>

<input
  id="p"
  type="password"
  placeholder="Password"
  required
>

<button type="submit">Login</button>

</form>

<p>
<a href="/forgot.html">Forgot Password?</a>
&nbsp;·&nbsp;
<a href="/register.html">Register</a>
</p>

<hr>

<p style="text-align:center">
<a href="/api/google">Continue with Google</a>
</p>

<p style="text-align:center">
<a href="/admin.html">Admin Login</a>
</p>

<div id="m" class="msg"></div>

</div>

<script>
async function go(e){

  e.preventDefault();

  const msg = document.getElementById("m");

  msg.textContent = "Login হচ্ছে...";

  try{

    const r = await fetch("/api/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        identifier:document.getElementById("i").value,
        password:document.getElementById("p").value
      })
    });

    const x = await r.json();

    if(x.ok){
      location="/home";
    }else{
      msg.textContent=x.error || "Login failed";
    }

  }catch(err){

    msg.textContent="Server error. আবার চেষ্টা করুন।";

  }
}
</script>

</body>
</html>
