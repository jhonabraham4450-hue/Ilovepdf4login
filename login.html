<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - iLovePDF4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #e5322d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #e5322d;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c92520;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #e5322d;
      text-decoration: none;
      margin: 0 5px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>iLovePDF4</h1>
    <div class="subtitle">Login to your account</div>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <div class="links">
      <a href="register.html">Register</a>
      |
      <a href="forgot.html">Forgot Password?</a>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "";
      message.style.color = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (data.success) {
          message.textContent = "Login successful!";
          message.style.color = "green";

          setTimeout(() => {
            window.location.href = "home.html";
          }, 1000);

        } else {
          message.textContent = data.message || "Login failed.";
          message.style.color = "red";
        }

      } catch (error) {
        message.textContent = "Server connection failed.";
        message.style.color = "red";
      }
    });
  </script>

</body>
</html>
