<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iLovePDF4 Register</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box{
  background:#fff;
  padding:28px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 30px #0001;
}
h1{text-align:center;color:#e53935}
input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:10px;
}
input{border:1px solid #ddd}
button{
  border:0;
  background:#e53935;
  color:white;
  font-weight:bold;
}
a{
  color:#e53935;
  text-decoration:none;
  font-weight:bold;
}
.msg{text-align:center;margin-top:10px}
</style>
</head>

<body>

<div class="box">

<h1>iLovePDF4</h1>

<p>Create your account</p>

<form onsubmit="registerUser(event)">

<input id="name" placeholder="Full Name" required>

<input id="email" type="email" placeholder="Email/Gmail" required>

<input id="mobile" type="tel" placeholder="Mobile Number" required>

<input id="password" type="password" placeholder="Password" minlength="6" required>

<input id="confirm" type="password" placeholder="Confirm Password" minlength="6" required>

<button type="submit">Create Account</button>

</form>

<p style="text-align:center">
<a href="/api/google">Continue with Google</a>
</p>

<p style="text-align:center">
Already have an account?
<a href="/login.html">Login</a>
</p>

<div id="msg" class="msg"></div>

</div>

<script>
async function registerUser(e){

  e.preventDefault();

  const msg=document.getElementById("msg");

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const mobile=document.getElementById("mobile").value.trim();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password !== confirm){
    msg.textContent="Password দুটো একই নয়।";
    return;
  }

  msg.textContent="Account তৈরি হচ্ছে...";

  try{

    const r=await fetch("/api/register",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        name,
        email,
        mobile,
        password
      })
    });

    const data=await r.json();

    if(data.ok){
      msg.style.color="green";
      msg.textContent="Registration successful! Login করুন।";

      setTimeout(()=>{
        location="/login.html";
      },1200);

    }else{
      msg.style.color="#d92d20";
      msg.textContent=data.error || "Registration failed";
    }

  }catch(err){

    msg.style.color="#d92d20";
    msg.textContent="Server error. আবার চেষ্টা করুন।";

  }
}
</script>

</body>
</html>
