<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password - iLovePDF4</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.box{
  background:#fff;
  padding:28px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 30px #0001;
}
h1{
  text-align:center;
  color:#e53935;
}
input,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  box-sizing:border-box;
  border-radius:10px;
}
input{
  border:1px solid #ddd;
}
button{
  border:0;
  background:#e53935;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
a{
  color:#e53935;
  text-decoration:none;
  font-weight:bold;
}
.msg{
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h1>iLovePDF4</h1>

<p>নতুন Password দিন</p>

<form onsubmit="resetPassword(event)">

<input
  id="password"
  type="password"
  placeholder="New Password"
  minlength="6"
  required
>

<input
  id="confirm"
  type="password"
  placeholder="Confirm New Password"
  minlength="6"
  required
>

<button type="submit">Reset Password</button>

</form>

<p style="text-align:center">
<a href="/login.html">Back to Login</a>
</p>

<div id="msg" class="msg"></div>

</div>

<script>
async function resetPassword(e){

  e.preventDefault();

  const msg=document.getElementById("msg");

  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password !== confirm){
    msg.style.color="#d92d20";
    msg.textContent="Password দুটো একই নয়।";
    return;
  }

  const params=new URLSearchParams(location.search);
  const token=params.get("token");

  if(!token){
    msg.style.color="#d92d20";
    msg.textContent="Invalid or missing reset link.";
    return;
  }

  msg.style.color="#333";
  msg.textContent="Password reset হচ্ছে...";

  try{

    const r=await fetch("/api/reset",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        token:token,
        password:password
      })
    });

    const data=await r.json();

    if(data.ok){

      msg.style.color="green";
      msg.textContent="Password সফলভাবে পরিবর্তন হয়েছে।";

      setTimeout(()=>{
        location="/login.html";
      },1500);

    }else{

      msg.style.color="#d92d20";
      msg.textContent=data.error || "Password reset failed.";

    }

  }catch(err){

    msg.style.color="#d92d20";
    msg.textContent="Server error. আবার চেষ্টা করুন।";

  }
}
</script>

</body>
</html>
