<html lang="en">
<head>

<style>

body{

<body>

<header class="header">

<div class="logo">
iLovePDF4
</div>

<button
  class="back-btn"
  onclick="goBack()"
  type="button"
>
← All Tools
</button>

</header>

<main class="container">

<div class="card">

<h2 id="toolTitle">
PDF Tool
</h2>

<div
  class="description"
  id="description"
>
Select your file to continue.
</div>

<div class="upload-box">

<div class="file-picker">

<button
  id="selectFileBtn"
  class="select-btn"
  type="button"
>
Select File
</button>

<input
  id="fileInput"
  type="file"
  multiple
>

</div>

Select your file and then press Process File.
</div>

</div>

  id="fileList"
  class="file-list"
></div>

<div class="buttons">

<button
  class="clear-btn"

  type="button"
>
Clear
</button>

  id="processBtn"
  class="process-btn"

  type="button"

>
Process File
</button>

</div>

<div id="downloadArea"></div>

</div>

</main>

<script>

"use strict";

/* =========================
   GET TOOL
========================= */

const params =
new URLSearchParams(
window.location.search
);

const tool =
params.get("tool") ||
"pdf-to-word";

/* =========================
   TOOL INFORMATION
========================= */

const toolInfo = {

"pdf-to-word":{
title:"PDF to Word",
description:"Convert PDF files to Word documents."
},

"word-to-pdf":{
title:"Word to PDF",
description:"Convert Word documents to PDF."
},

"pdf-to-powerpoint":{
title:"PDF to PowerPoint",
description:"Convert PDF files to PowerPoint."
},

"powerpoint-to-pdf":{
title:"PowerPoint to PDF",
description:"Convert PowerPoint files to PDF."
},

"pdf-to-excel":{
title:"PDF to Excel",
description:"Convert PDF files to Excel."
},

"excel-to-pdf":{
title:"Excel to PDF",
description:"Convert Excel files to PDF."
},

"jpg-to-pdf":{
title:"JPG to PDF",
description:"Convert JPG images to PDF."
},

"png-to-pdf":{
title:"PNG to PDF",
description:"Convert PNG images to PDF."
},

"image-to-pdf":{
title:"Image to PDF",
description:"Convert images to PDF."
},

"pdf-scanner":{
title:"PDF Scanner",
description:"Create a PDF from scanned images."
},

"merge-pdf":{
title:"Merge PDF",
description:"Merge multiple PDF files into one."
},

"split-pdf":{
title:"Split PDF",
description:"Split a PDF into separate pages."
},

"extract-pages":{
title:"Extract Pages",
description:"Extract pages from a PDF."
},

"remove-pages":{
title:"Remove Pages",
description:"Remove pages from a PDF."
},

"rotate-pdf":{
title:"Rotate PDF",
description:"Rotate PDF pages."
},

"jpg-to-png":{
title:"JPG to PNG",
description:"Convert JPG to PNG."
},

"png-to-jpg":{
title:"PNG to JPG",
description:"Convert PNG to JPG."
},

"image-to-jpg":{
title:"Image to JPG",
description:"Convert image to JPG."
},

"compress-image":{
title:"Compress Image",
description:"Compress an image."
},

"resize-image":{
title:"Resize Image",
description:"Resize an image."
}

};

const info =
toolInfo[tool] ||
{
title:"PDF Tool",
description:"Select a file to continue."
};

document.getElementById(
"toolTitle"
).textContent =
info.title;

document.getElementById(
"description"
).textContent =
info.description;

/* =========================
   ELEMENTS
========================= */

const fileInput =
document.getElementById(
"fileInput"
);

const selectFileBtn =
document.getElementById(
"selectFileBtn"
);

const fileList =
document.getElementById(
"fileList"
);

const processBtn =
document.getElementById(
"processBtn"
);

const message =
document.getElementById(
"message"
);

const downloadArea =
document.getElementById(
"downloadArea"
);

let selectedFiles = [];

/* =========================
   FILE SELECT
========================= */

selectFileBtn.addEventListener(
"click",
function(){

fileInput.click();

}
);

fileInput.addEventListener(
"change",
function(){

selectedFiles =
Array.from(
fileInput.files || []
);

showFiles();

}
);

/* =========================
   SHOW FILES
========================= */

function showFiles(){

fileList.innerHTML =
"";

downloadArea.innerHTML =
"";

message.textContent =
"";

if(!selectedFiles.length){

processBtn.disabled =
true;

return;

}

selectedFiles.forEach(
function(file,index){

const div =
document.createElement(
"div"
);

div.className =
"file-item";

div.textContent =
(index + 1) +
". " +
file.name +
" (" +
formatSize(file.size) +
")";

fileList.appendChild(
div
);

}
);

processBtn.disabled =
false;

}

/* =========================
   CLEAR
========================= */

function clearFiles(){

selectedFiles = [];

fileInput.value = "";

fileList.innerHTML = "";

downloadArea.innerHTML = "";

message.textContent = "";

processBtn.disabled = true;

}

/* =========================
   SIZE
========================= */

function formatSize(bytes){

if(bytes < 1024){

return bytes + " B";

}

if(bytes < 1024 * 1024){

return (
bytes / 1024
).toFixed(1) + " KB";

}

return (
bytes /
(1024 * 1024)
).toFixed(1) + " MB";

}

/* =========================
   BACK
========================= */

function goBack(){

window.location.href =
"/tools.html";

}

/* =========================
   MESSAGE
========================= */

function setMessage(text){

message.textContent =
text;

}

/* =========================
   CLOUDCONVERT TOOLS
========================= */

function isCloudConvertTool(){

return [

"pdf-to-word",

"word-to-pdf",

"pdf-to-powerpoint",

"powerpoint-to-pdf",

"pdf-to-excel",

"excel-to-pdf"

].includes(tool);

}

/* =========================
   PROCESS
========================= */

async function processFiles(){

if(!selectedFiles.length){

setMessage(
"Please select a file first."
);

return;

}

processBtn.disabled =
true;

downloadArea.innerHTML =
"";

setMessage(
"Processing... Please wait."
);

try{

/*
PDF TO WORD
LOCAL FALLBACK
*/

if(tool === "pdf-to-word"){

await pdfToWordLocal(
selectedFiles[0]
);

return;

}

/*
OTHER OFFICE TOOLS
USE EXISTING
CLOUDCONVERT BACKEND
*/

if(isCloudConvertTool()){

await cloudConvert(
selectedFiles[0]
);

return;

}

/*
IMAGE TO PDF
*/

if(

tool === "jpg-to-pdf" ||

tool === "png-to-pdf" ||

tool === "image-to-pdf" ||

tool === "pdf-scanner"

){

await imagesToPdf(
selectedFiles
);

return;

}

/*
MERGE
*/

if(tool === "merge-pdf"){

await mergePdf(
selectedFiles
);

return;

}

/*
PDF LOCAL TOOLS
*/

if(

tool === "split-pdf" ||

tool === "extract-pages" ||

tool === "remove-pages" ||

tool === "rotate-pdf"

){

await pdfLocalTool(
selectedFiles[0]
);

return;

}

/*
IMAGE CONVERSION
*/

if(

tool === "jpg-to-png" ||

tool === "png-to-jpg" ||

tool === "image-to-jpg"

){

await imageConvert(
selectedFiles[0]
);

return;

}

/*
COMPRESS
*/

if(tool === "compress-image"){

await compressImage(
selectedFiles[0]
);

return;

}

/*
RESIZE
*/

if(tool === "resize-image"){

await resizeImage(
selectedFiles[0]
);

return;

}

throw new Error(
"This tool is not configured yet."
);

}catch(error){

console.error(error);

setMessage(
error?.message ||
"Processing failed."
);

processBtn.disabled =
false;

}

}

/* =========================
   CLOUDCONVERT START
========================= */

async function cloudConvert(file){

setMessage(
"Starting conversion..."
);

const response =
await fetch(
"/api/convert-start",
{
method:"POST",

credentials:"include",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

tool:tool,

filename:file.name

})

}
);

const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch{

throw new Error(
"Server returned an invalid response."
);

}

if(!response.ok){

throw new Error(
data.error ||
"Unable to start conversion."
);

}

if(!data.jobId){

throw new Error(
data.error ||
"CloudConvert job was not created."
);

}

if(
!data.form ||
!data.form.url
){

throw new Error(
"CloudConvert upload form was not returned."
);

}

const formData =
new FormData();

if(data.form.parameters){

Object.keys(
data.form.parameters
).forEach(
function(key){

formData.append(
key,
data.form.parameters[key]
);

}
);

}

formData.append(
"file",
file
);

setMessage(
"Uploading file..."
);

const uploadResponse =
await fetch(
data.form.url,
{
method:"POST",
body:formData
}
);

if(!uploadResponse.ok){

throw new Error(
"File upload failed."
);

}

setMessage(
"Converting..."
);

await pollConversion(
data.jobId
);

}

/* =========================
   CLOUDCONVERT STATUS
========================= */

async function pollConversion(jobId){

const maxAttempts =
120;

for(
let attempt = 1;
attempt <= maxAttempts;
attempt++
){

await new Promise(
resolve =>
setTimeout(
resolve,
2000
)
);

const response =
await fetch(
"/api/convert-status?job=" +
encodeURIComponent(jobId),
{
method:"GET",
credentials:"include",
cache:"no-store"
}
);

const text =
await response.text();

let data;

try{

data =
JSON.parse(text);

}catch{

throw new Error(
"Invalid conversion status response."
);

}

if(!response.ok){

throw new Error(
data.error ||
"Unable to check conversion status."
);

}

if(
data.status === "finished"
){

const resultUrl =
data.url ||
data.resultUrl ||
data.result?.url;

if(!resultUrl){

throw new Error(
"Conversion finished but no download link was returned."
);

}

showDownload(
resultUrl,
"Download " + info.title,
data.filename ||
getOutputFilename()
);

setMessage(
"Conversion completed successfully."
);

processBtn.disabled =
false;

return;

}

if(

data.status === "error" ||

data.status === "failed"

){

throw new Error(
data.message ||
data.error ||
"Conversion failed."
);

}

setMessage(
"Converting... Please wait."
);

}

throw new Error(
"Conversion timed out. Please try again."
);

}

/* =========================
   OUTPUT FILENAME
========================= */

function getOutputFilename(){

const names = {

"pdf-to-word":
"converted.docx",

"word-to-pdf":
"converted.pdf",

"pdf-to-powerpoint":
"converted.pptx",

"powerpoint-to-pdf":
"converted.pdf",

"pdf-to-excel":
"converted.xlsx",

"excel-to-pdf":
"converted.pdf"

};

return names[tool] ||
"converted-file";

}

/* =========================
   LOCAL PDF TO WORD
========================= */

async function pdfToWordLocal(file){

setMessage(
"Reading PDF text locally..."
);

if(!window.pdfjsLib){

throw new Error(
"PDF reader library could not be loaded."
);

}

const bytes =
new Uint8Array(
await file.arrayBuffer()
);

const pdf =
await pdfjsLib.getDocument({
data:bytes
}).promise;

let html =
"<html>" +
"<head>" +
"<meta charset='utf-8'>" +
"</head>" +
"<body>";

for(
let pageNo = 1;
pageNo <= pdf.numPages;
pageNo++
){

const page =
await pdf.getPage(
pageNo
);

const content =
await page.getTextContent();

let lastY =
null;

for(
const item of content.items
){

const y =
Math.round(
item.transform[5]
);

if(
lastY !== null &&
Math.abs(y-lastY) > 8
){

html +=
"<br>";

}

html +=
escapeHtml(
item.str
) + " ";

lastY =
y;

}

if(
pageNo < pdf.numPages
){

html +=
"<br><br><hr><br>";

}

}

html +=
"</body></html>";

const blob =
new Blob(
[html],
{
type:"application/msword"
}
);

showBlobDownload(
blob,
"converted.doc",
"Download Word"
);

setMessage(
"PDF converted to a Word-compatible document. Text/layout may differ from the original."
);

processBtn.disabled =
false;

}

function escapeHtml(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
);

}

/* =========================
   IMAGES TO PDF
========================= */

async function imagesToPdf(files){

const pdfDoc =
await PDFLib.PDFDocument.create();

let count = 0;

for(
const file of files
){

if(
!file.type.startsWith(
"image/"
)
){

continue;

}

const bytes =
await file.arrayBuffer();

let image;

if(
file.type ===
"image/png"
){

image =
await pdfDoc.embedPng(
bytes
);

}else{

image =
await pdfDoc.embedJpg(
bytes
);

}

const page =
pdfDoc.addPage(
[
image.width,
image.height
]
);

page.drawImage(
image,
{
x:0,
y:0,
width:image.width,
height:image.height
}
);

count++;

}

if(!count){

throw new Error(
"Please select an image file."
);

}

const bytes =
await pdfDoc.save();

showBlobDownload(
new Blob(
[bytes],
{
type:"application/pdf"
}
),
"converted-images.pdf",
"Download PDF"
);

setMessage(
"PDF created successfully."
);

processBtn.disabled =
false;

}

/* =========================
   MERGE PDF
========================= */

async function mergePdf(files){

if(files.length < 2){

throw new Error(
"Please select at least two PDF files."
);

}

const merged =
await PDFLib.PDFDocument.create();

for(
const file of files
){

const pdf =
await PDFLib.PDFDocument.load(
await file.arrayBuffer()
);

const pages =
await merged.copyPages(
pdf,
pdf.getPageIndices()
);

pages.forEach(
page =>
merged.addPage(page)
);

}

const bytes =
await merged.save();

showBlobDownload(
new Blob(
[bytes],
{
type:"application/pdf"
}
),
"merged.pdf",
"Download Merged PDF"
);

setMessage(
"PDF files merged successfully."
);

processBtn.disabled =
false;

}

/* =========================
   LOCAL PDF TOOLS
========================= */

async function pdfLocalTool(file){

const pdf =
await PDFLib.PDFDocument.load(
await file.arrayBuffer()
);

/*
ROTATE
*/

if(tool === "rotate-pdf"){

pdf.getPages().forEach(
function(page){

const current =
page.getRotation().angle ||
0;

page.setRotation(
PDFLib.degrees(
(current + 90) % 360
)
);

}
);

const output =
await pdf.save();

showBlobDownload(
new Blob(
[output],
{
type:"application/pdf"
}
),
"rotated.pdf",
"Download PDF"
);

setMessage(
"PDF rotated successfully."
);

processBtn.disabled =
false;

return;

}

/*
REMOVE LAST PAGE
*/

if(tool === "remove-pages"){

if(
pdf.getPageCount() < 2
){

throw new Error(
"The PDF must contain at least two pages."
);

}

pdf.removePage(
pdf.getPageCount() - 1
);

const output =
await pdf.save();

showBlobDownload(
new Blob(
[output],
{
type:"application/pdf"
}
),
"pages-removed.pdf",
"Download PDF"
);

setMessage(
"Last page removed successfully."
);

processBtn.disabled =
false;

return;

}

/*
SPLIT / EXTRACT
*/

if(

tool === "split-pdf" ||

tool === "extract-pages"

){

const newPdf =
await PDFLib.PDFDocument.create();

const pages =
await newPdf.copyPages(
pdf,
[0]
);

pages.forEach(
page =>
newPdf.addPage(page)
);

const output =
await newPdf.save();

showBlobDownload(
new Blob(
[output],
{
type:"application/pdf"
}
),

tool === "split-pdf"
?
"split-page-1.pdf"
:
"extracted-page.pdf",

"Download PDF"
);

setMessage(
"First page extracted successfully."
);

processBtn.disabled =
false;

return;

}

const output =
await pdf.save();

showBlobDownload(
new Blob(
[output],
{
type:"application/pdf"
}
),
"processed.pdf",
"Download PDF"
);

setMessage(
"PDF processed successfully."
);

processBtn.disabled =
false;

}

/* =========================
   LOAD IMAGE
========================= */

function loadImage(file){

return new Promise(
function(resolve,reject){

const img =
new Image();

const url =
URL.createObjectURL(
file
);

img.onload =
function(){

URL.revokeObjectURL(
url
);

resolve(img);

};

img.onerror =
function(){

URL.revokeObjectURL(
url
);

reject(
new Error(
"Unable to read image."
)
);

};

img.src =
url;

}
);

}

/* =========================
   IMAGE CONVERT
========================= */

async function imageConvert(file){

const img =
await loadImage(
file
);

const canvas =
document.createElement(
"canvas"
);

canvas.width =
img.naturalWidth;

canvas.height =
img.naturalHeight;

const ctx =
canvas.getContext(
"2d"
);

if(
tool === "png-to-jpg"
){

ctx.fillStyle =
"#fff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}

ctx.drawImage(
img,
0,
0
);

if(
tool === "jpg-to-png"
){

await canvasToDownload(
canvas,
"image/png",
"converted.png"
);

}else{

await canvasToDownload(
canvas,
"image/jpeg",
"converted.jpg",
.92
);

}

setMessage(
"Image converted successfully."
);

processBtn.disabled =
false;

}

/* =========================
   COMPRESS IMAGE
========================= */

async function compressImage(file){

const img =
await loadImage(
file
);

const canvas =
document.createElement(
"canvas"
);

canvas.width =
img.naturalWidth;

canvas.height =
img.naturalHeight;

const ctx =
canvas.getContext(
"2d"
);

ctx.drawImage(
img,
0,
0
);

await canvasToDownload(
canvas,
"image/jpeg",
"compressed.jpg",
.65
);

setMessage(
"Image compressed successfully."
);

processBtn.disabled =
false;

}

/* =========================
   RESIZE IMAGE
========================= */

async function resizeImage(file){

const img =
await loadImage(
file
);

const maxWidth =
1200;

const ratio =
Math.min(
1,
maxWidth /
img.naturalWidth
);

const canvas =
document.createElement(
"canvas"
);

canvas.width =
Math.round(
img.naturalWidth *
ratio
);

canvas.height =
Math.round(
img.naturalHeight *
ratio
);

const ctx =
canvas.getContext(
"2d"
);

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

await canvasToDownload(
canvas,
"image/jpeg",
"resized.jpg",
.90
);

setMessage(
"Image resized successfully."
);

processBtn.disabled =
false;

}

/* =========================
   CANVAS DOWNLOAD
========================= */

function canvasToDownload(
canvas,
type,
filename,
quality
){

return new Promise(
function(resolve,reject){

canvas.toBlob(
function(blob){

if(!blob){

reject(
new Error(
"Unable to create output file."
)
);

return;

}

showBlobDownload(
blob,
filename,
"Download File"
);

resolve();

},
type,
quality
);

}
);

/* =========================
   BLOB DOWNLOAD
========================= */

function showBlobDownload(
blob,
filename,
text
){

const url =
URL.createObjectURL(
blob
);

showDownload(
url,
text,
filename
);

}

/* =========================
   DOWNLOAD
========================= */

function showDownload(
url,
text,
filename
){

downloadArea.innerHTML =
"";

const link =
document.createElement(
"a"
);

link.href =
url;

link.className =
"download-btn";

link.textContent =
text ||
"Download";

if(filename){

link.download =
filename;

}

link.target =
"_blank";

downloadArea.appendChild(
link
);

}

</script>
