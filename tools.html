<script>


const params =
new URLSearchParams(location.search);


const currentTool =
params.get("tool") || "pdf-to-word";


const tools = {

desc:"Convert PDF into an editable Word document.",
accept:".pdf",
multiple:false
},


"word-to-pdf":{
title:"Word to PDF",
desc:"Convert Word documents to PDF.",
accept:".doc,.docx",
multiple:false
},


"pdf-to-powerpoint":{
title:"PDF to PowerPoint",
desc:"Convert PDF into PowerPoint.",
accept:".pdf",
multiple:false
},


"powerpoint-to-pdf":{
title:"PowerPoint to PDF",
desc:"Convert PowerPoint presentations to PDF.",
accept:".ppt,.pptx",
multiple:false
},


"pdf-to-excel":{
title:"PDF to Excel",
desc:"Convert PDF into Excel.",
accept:".pdf",
multiple:false
},


"excel-to-pdf":{
title:"Excel to PDF",
desc:"Convert Excel files to PDF.",
accept:".xls,.xlsx,.csv",
multiple:false
},


"jpg-to-pdf":{
title:"JPG to PDF",
desc:"Convert JPG images into PDF.",
accept:"image/jpeg",
multiple:true
},


"png-to-pdf":{
title:"PNG to PDF",
desc:"Convert PNG images into PDF.",
accept:"image/png",
multiple:true
},


"image-to-pdf":{
title:"Image to PDF",
desc:"Convert images into PDF.",
accept:"image/*",
multiple:true
},


"merge-pdf":{
title:"Merge PDF",
desc:"Combine multiple PDF files into one PDF.",
accept:".pdf",
multiple:true
},


"split-pdf":{
title:"Split PDF",
desc:"Split every page of a PDF into separate PDF files.",
accept:".pdf",
multiple:false
},


"extract-pages":{
title:"Extract Pages",
desc:"Extract selected pages from a PDF.",
accept:".pdf",
multiple:false
},


"remove-pages":{
title:"Remove Pages",
desc:"Remove selected pages from a PDF.",
accept:".pdf",
multiple:false
},


"rotate-pdf":{
title:"Rotate PDF",
desc:"Rotate all PDF pages 90 degrees.",
accept:".pdf",
multiple:false
},


"compress-pdf":{
title:"Compress PDF",
desc:"Reduce PDF file size where possible.",
accept:".pdf",
multiple:false
},


"resize-pdf":{
title:"Resize PDF",
desc:"Resize PDF pages.",
accept:".pdf",
multiple:false
},


"crop-pdf":{
title:"Crop PDF",
desc:"Crop PDF pages.",
accept:".pdf",
multiple:false
},


"watermark-pdf":{
title:"Watermark PDF",
desc:"Add a watermark to PDF pages.",
accept:".pdf",
multiple:false
},


"page-numbers":{
title:"Page Numbers",
desc:"Add page numbers to PDF.",
accept:".pdf",
multiple:false
},


"sign-pdf":{
title:"Sign PDF",
desc:"Add a signature image to PDF.",
accept:".pdf",
multiple:false
},


"protect-pdf":{
title:"Protect PDF",
desc:"Protect a PDF with a password.",
accept:".pdf",
multiple:false
},


"unlock-pdf":{
title:"Unlock PDF",
desc:"Remove PDF password protection when possible.",
accept:".pdf",
multiple:false
},


"redact-pdf":{
title:"Redact PDF",
desc:"Redact PDF content.",
accept:".pdf",
multiple:false
},


"pdf-scanner":{
title:"PDF Scanner",
desc:"Convert scanned images into a PDF.",
accept:"image/*",
multiple:true
},


"ocr-pdf":{
title:"OCR PDF",
desc:"Extract text from PDF using OCR.",
accept:".pdf",
multiple:false
},


"image-ocr":{
title:"Image OCR",
desc:"Extract text from an image.",
accept:"image/*",
multiple:false
},


"jpg-to-png":{
title:"JPG to PNG",
desc:"Convert JPG image to PNG.",
accept:"image/jpeg",
multiple:false
},


"png-to-jpg":{
title:"PNG to JPG",
desc:"Convert PNG image to JPG.",
accept:"image/png",
multiple:false
},


"image-to-jpg":{
title:"Image to JPG",
desc:"Convert image to JPG.",
accept:"image/*",
multiple:false
},


"resize-image":{
title:"Resize Image",
desc:"Resize an image.",
accept:"image/*",
multiple:false
},


"compress-image":{
title:"Compress Image",
desc:"Compress an image.",
accept:"image/*",
multiple:false
}

};


const tool =
tools[currentTool] ||
tools["pdf-to-word"];


document.getElementById("title").textContent =
tool.title;


document.getElementById("description").textContent =
tool.desc;


const input =
document.getElementById("fileInput");


input.accept =
tool.accept;


input.multiple =
tool.multiple;


document.getElementById("fileHint").textContent =
tool.multiple
? "You can select multiple files"
: "Select one file";


if(
currentTool==="extract-pages" ||
currentTool==="remove-pages"
){

document.getElementById("pageOptions")
.style.display="block";

}


input.addEventListener(
"change",
function(){

if(this.files.length){

document.getElementById("fileHint")
.textContent =
this.files.length +
" file(s) selected";

}

});


function status(
message,
type="info"
){

const box =
document.getElementById("status");

box.style.display="block";

box.className=type;

box.innerHTML =
message;

}


function statusText(
message,
type="info"
){

const box =
document.getElementById("status");

box.style.display="block";

box.className=type;

box.textContent =
message;

}


function downloadBlob(
blob,
name
){

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
2000
);

}


function downloadBytes(
bytes,
name,
type
){

const blob =
new Blob(
[bytes],
{type}
);

downloadBlob(
blob,
name
);

}


function escapeHTML(str){

return String(str)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
   MAIN PROCESS FUNCTION
========================= */


async function processFile(){

const files =
[...input.files];


if(!files.length){

statusText(
"❌ Please select a file first.",
"error"
);

return;

}


const btn =
document.getElementById(
"processBtn"
);


btn.disabled=true;

btn.textContent=
"Processing...";


statusText(
"⏳ Processing your file...",
"info"
);


try{


/*
CloudConvert supported tools
*/

const cloudConvertTools = [

"pdf-to-word",
"word-to-pdf",

"pdf-to-powerpoint",
"powerpoint-to-pdf",

"pdf-to-excel",
"excel-to-pdf"

];


if(
cloudConvertTools.includes(
currentTool
)
){

await cloudConvert(
files[0]
);

return;

}


/*
Local tools
*/

switch(currentTool){


case "jpg-to-pdf":

case "png-to-pdf":

case "image-to-pdf":

case "pdf-scanner":

await imagesToPDF(files);

break;


case "merge-pdf":

await mergePDF(files);

break;


case "split-pdf":

await splitPDF(files[0]);

break;


case "extract-pages":

await extractPages(files[0]);

break;


case "remove-pages":

await removePages(files[0]);

break;


case "rotate-pdf":

await rotatePDF(files[0]);

break;


case "jpg-to-png":

await convertImage(
files[0],
"png"
);

break;


case "png-to-jpg":

case "image-to-jpg":

await convertImage(
files[0],
"jpeg"
);

break;


case "compress-image":

await compressImage(
files[0]
);

break;


case "resize-image":

await resizeImage(
files[0]
);

break;


default:

statusText(
"⚠️ This tool is not connected to a processing engine yet.",
"info"
);

}


}catch(error){

console.error(error);

statusText(
"❌ Processing failed.\n\n"+
(error.message || error),
"error"
);

}finally{

btn.disabled=false;

btn.textContent=
"Process File";

}

}


/* =========================
   CLOUDCONVERT
========================= */


async function cloudConvert(file){

statusText(
"⏳ Creating conversion job...",
"info"
);


/*
Step 1:
Create CloudConvert job
*/

const startResponse =
await fetch(
"/api/convert-start",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

tool:currentTool,

filename:file.name

})

}
);


const startData =
await startResponse.json();


if(!startResponse.ok){

throw new Error(
startData.error ||
"Could not create conversion job."
);

}


if(
!startData.jobId ||
!startData.form
){

throw new Error(
"CloudConvert did not return a valid upload form."
);

}


const form =
startData.form;


if(
!form.url
){

throw new Error(
"CloudConvert upload URL is missing."
);

}


/*
Step 2:
Upload original file
*/

statusText(
"⏳ Uploading file to conversion server...",
"info"
);


const uploadData =
new FormData();


const parameters =
form.parameters || {};


Object.keys(parameters)
.forEach(
key=>{

uploadData.append(
key,
parameters[key]
);

}
);


uploadData.append(
"file",
file,
file.name
);


const uploadResponse =
await fetch(
form.url,
{
method:"POST",
body:uploadData
}
);


if(
!uploadResponse.ok
){

const uploadText =
await uploadResponse.text()
.catch(
()=>""
);

throw new Error(
"File upload failed."+
(
uploadText
? "\n"+uploadText
: ""
)
);

}


/*
Step 3:
Wait for conversion
*/

statusText(
"⏳ File uploaded. Conversion is processing...",
"info"
);


const result =
await waitForConversion(
startData.jobId
);


if(
result.status!=="finished"
){

throw new Error(
result.error ||
"Conversion failed."
);

}


/*
Step 4:
Download converted file
*/

statusText(
"⏳ Conversion finished. Preparing download...",
"info"
);


if(!result.url){

throw new Error(
"Conversion finished but download URL is missing."
);

}


const outputName =
result.filename ||
getOutputFilename(
file.name,
currentTool
);


const link =
document.createElement("a");


link.href =
result.url;


link.target="_blank";

link.rel="noopener";

link.download =
outputName;


link.className =
"download-link";


link.textContent =
"⬇️ Download Converted File";


const box =
document.getElementById(
"status"
);


box.innerHTML =
"✅ Conversion completed successfully.<br><br>";

box.appendChild(link);


box.className="success";

box.style.display="block";

}


/* =========================
   POLL CLOUDCONVERT STATUS
========================= */


async function waitForConversion(
jobId
){

const maxAttempts=120;

for(
let attempt=0;
attempt<maxAttempts;
attempt++
){


const response =
await fetch(
"/api/convert-status?job="+
encodeURIComponent(jobId)
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Could not check conversion status."
);

}


if(
data.status==="finished"
){

return data;

}


if(
data.status==="error"
){

throw new Error(
data.error ||
"CloudConvert conversion failed."
);

}


if(
data.status==="failed"
){

throw new Error(
data.error ||
"CloudConvert conversion failed."
);

}


const seconds =
Math.min(
5,
2 + Math.floor(attempt/10)
);


statusText(
"⏳ Conversion in progress...\n\n"+
"Please wait...",
"info"
);


await new Promise(
resolve=>
setTimeout(
resolve,
seconds*1000
)
);

}


throw new Error(
"Conversion timed out. Please try again."
);

}


/* =========================
   OUTPUT FILENAME
========================= */


function getOutputFilename(
filename,
tool
){

const base =
filename.replace(
/\.[^.]+$/,
""
);


switch(tool){

case "pdf-to-word":
return base+".docx";

case "word-to-pdf":
return base+".pdf";

case "pdf-to-powerpoint":
return base+".pptx";

case "powerpoint-to-pdf":
return base+".pdf";

case "pdf-to-excel":
return base+".xlsx";

case "excel-to-pdf":
return base+".pdf";

default:
return base+"-converted";

}

}


/* =========================
   PDF TO WORD
   Fallback/local function
========================= */


async function pdfToWord(file){

statusText(
"⏳ Reading PDF text...",
"info"
);


const pdfjs =
await import(
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
);


pdfjs.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const data =
await file.arrayBuffer();


const pdf =
await pdfjs.getDocument({
data:data
}).promise;


let text="";


for(
let i=1;
i<=pdf.numPages;
i++
){

const page =
await pdf.getPage(i);


const content =
await page.getTextContent();


const pageText =
content.items
.map(
item=>item.str
)
.join(" ");


text +=
"Page "+i+
"\n\n";


text +=
pageText+
"\n\n";

}


if(!text.trim()){

throw new Error(
"No selectable text found. This may be a scanned/image PDF."
);

}


const html =

`<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<style>

body{
font-family:Arial;
font-size:14pt;
}

</style>

</head>

<body>

${escapeHTML(text)
.replace(
/\n/g,
"<br>"
)}

</body>

</html>`;


const blob =
new Blob(
[html],
{
type:"application/msword"
}
);


downloadBlob(
blob,
file.name.replace(
/\.pdf$/i,
""
)+
".doc"
);


statusText(
"✅ PDF converted successfully.\n\n"+
"Your Word-compatible .doc file has been downloaded.",
"success"
);

}


/* =========================
   IMAGES TO PDF
========================= */


async function imagesToPDF(
files
){

const {
PDFDocument
}=PDFLib;


const pdf =
await PDFDocument.create();


for(
const file of files
){

const bytes =
await file.arrayBuffer();


let image;


if(
file.type==="image/png"
){

image =
await pdf.embedPng(
bytes
);

}else if(
file.type==="image/jpeg" ||
file.type==="image/jpg"
){

image =
await pdf.embedJpg(
bytes
);

}else{

throw new Error(
"Please select JPG or PNG images."
);

}


const width =
image.width;


const height =
image.height;


const page =
pdf.addPage(
[
width,
height
]
);


page.drawImage(
image,
{
x:0,
y:0,
width:width,
height:height
}
);

}


const bytes =
await pdf.save();


downloadBytes(
bytes,
"iLovePDF4-images.pdf",
"application/pdf"
);


statusText(
"✅ PDF created successfully.",
"success"
);

}


/* =========================
   MERGE PDF
========================= */


async function mergePDF(
files
){

if(
files.length<2
){

throw new Error(
"Select at least 2 PDF files to merge."
);

}


const {
PDFDocument
}=PDFLib;


const output =
await PDFDocument.create();


for(
const file of files
){

const bytes =
await file.arrayBuffer();


const pdf =
await PDFDocument.load(
bytes
);


const pages =
await output.copyPages(
pdf,
pdf.getPageIndices()
);


pages.forEach(
page=>
output.addPage(page)
);

}


const bytes =
await output.save();


downloadBytes(
bytes,
"iLovePDF4-merged.pdf",
"application/pdf"
);


statusText(
"✅ "+
files.length+
" PDF files merged successfully.",
"success"
);

}


/* =========================
   SPLIT PDF
========================= */


async function splitPDF(
file
){

const {
PDFDocument
}=PDFLib;


const bytes =
await file.arrayBuffer();


const source =
await PDFDocument.load(
bytes
);


const total =
source.getPageCount();


for(
let i=0;
i<total;
i++
){

const output =
await PDFDocument.create();


const [page] =
await output.copyPages(
source,
[i]
);


output.addPage(
page
);


const data =
await output.save();


downloadBytes(
data,
"page-"+(i+1)+".pdf",
"application/pdf"
);

}


statusText(
"✅ PDF split successfully.\n\n"+
total+
" page(s) created.",
"success"
);

}


/* =========================
   EXTRACT PAGES
========================= */


async function extractPages(
file
){

const value =
document
.getElementById(
"pageNumbers"
)
.value
.trim();


if(!value){

throw new Error(
"Enter page numbers first. Example: 1,3,5"
);

}


const pages =
parsePageNumbers(
value
);


const {
PDFDocument
}=PDFLib;


const source =
await PDFDocument.load(
await file.arrayBuffer()
);


const output =
await PDFDocument.create();


const indexes =
pages

.filter(
n=>
n>=1 &&
n<=source.getPageCount()
)

.map(
n=>n-1
);


if(!indexes.length){

throw new Error(
"No valid page numbers found."
);

}


const copied =
await output.copyPages(
source,
indexes
);


copied.forEach(
page=>
output.addPage(page)
);


const data =
await output.save();


downloadBytes(
data,
"extracted-pages.pdf",
"application/pdf"
);


statusText(
"✅ Selected pages extracted successfully.",
"success"
);

}


/* =========================
   REMOVE PAGES
========================= */


async function removePages(
file
){

const value =
document
.getElementById(
"pageNumbers"
)
.value
.trim();


if(!value){

throw new Error(
"Enter page numbers to remove."
);

}


const remove =
parsePageNumbers(
value
);


const {
PDFDocument
}=PDFLib;


const source =
await PDFDocument.load(
await file.arrayBuffer()
);


const output =
await PDFDocument.create();


for(
let i=0;
i<source.getPageCount();
i++
){

const pageNumber =
i+1;


if(
!remove.includes(
pageNumber
)
){

const [page] =
await output.copyPages(
source,
[i]
);


output.addPage(
page
);

}

}


if(
output.getPageCount()===0
){

throw new Error(
"You cannot remove all pages."
);

}


const data =
await output.save();


downloadBytes(
data,
"pages-removed.pdf",
"application/pdf"
);


statusText(
"✅ Selected pages removed successfully.",
"success"
);

}


/* =========================
   PAGE NUMBER PARSER
========================= */


function parsePageNumbers(
value
){

const result=[];


value.split(",")
.forEach(
part=>{

part =
part.trim();


if(
!part
){
return;
}


if(
part.includes("-")
){

const [a,b] =
part
.split("-")
.map(Number);


if(
Number.isInteger(a) &&
Number.isInteger(b) &&
a>0 &&
b>=a
){

for(
let i=a;
i<=b;
i++
){

result.push(i);

}

}

}else{

const n =
Number(part);


if(
Number.isInteger(n) &&
n>0
){

result.push(n);

}

}

}
);


return [
...new Set(result)
]
.sort(
(a,b)=>a-b
);

}


/* =========================
   ROTATE PDF
========================= */


async function rotatePDF(
file
){

const {
PDFDocument,
degrees
}=PDFLib;


const pdf =
await PDFDocument.load(
await file.arrayBuffer()
);


pdf.getPages()
.forEach(
page=>{

page.setRotation(
degrees(
(
page.getRotation().angle+
90
)%360
)
);

}
);


const bytes =
await pdf.save();


downloadBytes(
bytes,
"rotated.pdf",
"application/pdf"
);


statusText(
"✅ PDF rotated successfully.",
"success"
);

}


/* =========================
   IMAGE CONVERSION
========================= */


async function convertImage(
file,
format
){

const img =
new Image();


const url =
URL.createObjectURL(
file
);


await new Promise(
(resolve,reject)=>{

img.onload=resolve;

img.onerror=reject;

img.src=url;

}
);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
img.naturalWidth;


canvas.height =
img.naturalHeight;


const ctx =
canvas.getContext(
"2d"
);


if(
format==="jpeg"
){

ctx.fillStyle =
"#ffffff";


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}


ctx.drawImage(
img,
0,
0
);


const mime =
format==="png"
? "image/png"
: "image/jpeg";


const blob =
await new Promise(
resolve=>
canvas.toBlob(
resolve,
mime,
0.92
)
);


if(!blob){

URL.revokeObjectURL(
url
);

throw new Error(
"Could not create converted image."
);

}


downloadBlob(
blob,
file.name.replace(
/\.[^.]+$/,
""
)+
"."+
(
format==="png"
? "png"
: "jpg"
)
);


URL.revokeObjectURL(
url
);


statusText(
"✅ Image converted successfully.",
"success"
);

}
