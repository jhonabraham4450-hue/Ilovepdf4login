<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLovePDF4 Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#222;
}
header{
 background:#e5322d;
 color:white;
 padding:16px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:24px;font-weight:bold}
.logout{
 background:white;
 color:#e5322d;
 border:0;
 padding:8px 14px;
 border-radius:6px;
 font-weight:bold;
}
.container{
 max-width:850px;
 margin:30px auto;
 padding:20px;
}
.back{
 display:inline-block;
 margin-bottom:20px;
 color:#e5322d;
 text-decoration:none;
 font-weight:bold;
}
.card{
 background:white;
 padding:30px;
 border-radius:15px;
 box-shadow:0 5px 25px rgba(0,0,0,.08);
}
h1{margin-top:0}
.desc{color:#666;margin-bottom:25px}
.upload{
 border:2px dashed #bbb;
 border-radius:12px;
 padding:35px 20px;
 text-align:center;
 background:#fafafa;
}
input[type=file]{
 width:100%;
 padding:15px;
 background:white;
 border:1px solid #ddd;
 border-radius:8px;
}
button{
 margin-top:20px;
 width:100%;
 padding:14px;
 border:0;
 border-radius:8px;
 background:#e5322d;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{
 background:#aaa;
 cursor:not-allowed;
}
#status{
 margin-top:20px;
 padding:15px;
 border-radius:8px;
 display:none;
 white-space:pre-wrap;
}
.info{background:#eef5ff;color:#1455a0}
.success{background:#eaf8ee;color:#176b2c}
.error{background:#fff0f0;color:#a40000}
footer{
 text-align:center;
 color:#777;
 padding:25px;
}
.page-options{
 display:none;
 margin-top:20px;
}
.page-options input{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:7px;
}
</style>

</head>

<body>

<header>
 <div class="logo">iLovePDF4</div>
 <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

<a class="back" href="/tools.html">← Back to All Tools</a>

<div class="card">

<h1 id="title">PDF Tool</h1>
<div class="desc" id="description">
 Select your file and process it.
</div>

<div class="upload">
<input id="fileInput" type="file">
<div id="fileHint" style="margin-top:12px;color:#777">
 Select your file
</div>
</div>

<div class="page-options" id="pageOptions">
 <label><b>Page numbers</b></label>
 <p style="font-size:13px;color:#777">
 Example: 1,3,5 or 2-4
 </p>
 <input id="pageNumbers" placeholder="Example: 1,3,5">
</div>

<button id="processBtn" onclick="processFile()">
 Process File
</button>

<div id="status"></div>

</div>
</div>

<footer>
© 2026 iLovePDF4
</footer>

<script>

const params = new URLSearchParams(location.search);
const currentTool = params.get("tool") || "pdf-to-word";

const tools = {

"pdf-to-word":{
 title:"PDF to Word",
 desc:"Convert PDF text into an editable Word document.",
 accept:".pdf",
 multiple:false
},

"word-to-pdf":{
 title:"Word to PDF",
 desc:"Convert Word documents to PDF.",
 accept:".doc,.docx",
 multiple:false
},

"pdf-to-powerpoint":{
 title:"PDF to PowerPoint",
 desc:"Convert PDF pages to PowerPoint.",
 accept:".pdf",
 multiple:false
},

"powerpoint-to-pdf":{
 title:"PowerPoint to PDF",
 desc:"Convert PowerPoint presentations to PDF.",
 accept:".ppt,.pptx",
 multiple:false
},

"pdf-to-excel":{
 title:"PDF to Excel",
 desc:"Extract PDF text into an Excel-compatible file.",
 accept:".pdf",
 multiple:false
},

"excel-to-pdf":{
 title:"Excel to PDF",
 desc:"Convert Excel files to PDF.",
 accept:".xls,.xlsx,.csv",
 multiple:false
},

"jpg-to-pdf":{
 title:"JPG to PDF",
 desc:"Convert JPG images into PDF.",
 accept:"image/jpeg",
 multiple:true
},

"png-to-pdf":{
 title:"PNG to PDF",
 desc:"Convert PNG images into PDF.",
 accept:"image/png",
 multiple:true
},

"image-to-pdf":{
 title:"Image to PDF",
 desc:"Convert images into PDF.",
 accept:"image/*",
 multiple:true
},

"merge-pdf":{
 title:"Merge PDF",
 desc:"Combine multiple PDF files into one PDF.",
 accept:".pdf",
 multiple:true
},

"split-pdf":{
 title:"Split PDF",
 desc:"Split every page of a PDF into separate PDF files.",
 accept:".pdf",
 multiple:false
},

"extract-pages":{
 title:"Extract Pages",
 desc:"Extract selected pages from a PDF.",
 accept:".pdf",
 multiple:false
},

"remove-pages":{
 title:"Remove Pages",
 desc:"Remove selected pages from a PDF.",
 accept:".pdf",
 multiple:false
},

"rotate-pdf":{
 title:"Rotate PDF",
 desc:"Rotate all PDF pages 90 degrees.",
 accept:".pdf",
 multiple:false
},

"compress-pdf":{
 title:"Compress PDF",
 desc:"Reduce PDF file size where possible.",
 accept:".pdf",
 multiple:false
},

"resize-pdf":{
 title:"Resize PDF",
 desc:"Resize PDF pages.",
 accept:".pdf",
 multiple:false
},

"crop-pdf":{
 title:"Crop PDF",
 desc:"Crop PDF pages.",
 accept:".pdf",
 multiple:false
},

"watermark-pdf":{
 title:"Watermark PDF",
 desc:"Add a watermark to PDF pages.",
 accept:".pdf",
 multiple:false
},

"page-numbers":{
 title:"Page Numbers",
 desc:"Add page numbers to PDF.",
 accept:".pdf",
 multiple:false
},

"sign-pdf":{
 title:"Sign PDF",
 desc:"Add a signature image to PDF.",
 accept:".pdf",
 multiple:false
},

"protect-pdf":{
 title:"Protect PDF",
 desc:"Protect a PDF with a password.",
 accept:".pdf",
 multiple:false
},

"unlock-pdf":{
 title:"Unlock PDF",
 desc:"Remove PDF password protection when possible.",
 accept:".pdf",
 multiple:false
},

"redact-pdf":{
 title:"Redact PDF",
 desc:"Redact PDF content.",
 accept:".pdf",
 multiple:false
},

"pdf-scanner":{
 title:"PDF Scanner",
 desc:"Convert scanned images into a PDF.",
 accept:"image/*",
 multiple:true
},

"ocr-pdf":{
 title:"OCR PDF",
 desc:"Extract text from PDF using OCR.",
 accept:".pdf",
 multiple:false
},

"image-ocr":{
 title:"Image OCR",
 desc:"Extract text from an image.",
 accept:"image/*",
 multiple:false
},

"jpg-to-png":{
 title:"JPG to PNG",
 desc:"Convert JPG image to PNG.",
 accept:"image/jpeg",
 multiple:false
},

"png-to-jpg":{
 title:"PNG to JPG",
 desc:"Convert PNG image to JPG.",
 accept:"image/png",
 multiple:false
},

"image-to-jpg":{
 title:"Image to JPG",
 desc:"Convert image to JPG.",
 accept:"image/*",
 multiple:false
},

"resize-image":{
 title:"Resize Image",
 desc:"Resize an image.",
 accept:"image/*",
 multiple:false
},

"compress-image":{
 title:"Compress Image",
 desc:"Compress an image.",
 accept:"image/*",
 multiple:false
}

};

const tool = tools[currentTool] || tools["pdf-to-word"];

document.getElementById("title").textContent = tool.title;
document.getElementById("description").textContent = tool.desc;

const input = document.getElementById("fileInput");
input.accept = tool.accept;
input.multiple = tool.multiple;

document.getElementById("fileHint").textContent =
 tool.multiple ? "You can select multiple files" : "Select one file";

if(
 currentTool==="extract-pages" ||
 currentTool==="remove-pages"
){
 document.getElementById("pageOptions").style.display="block";
}

input.addEventListener("change",function(){
 if(this.files.length){
   document.getElementById("fileHint").textContent =
   this.files.length + " file(s) selected";
 }
});

function status(message,type="info"){
 const box=document.getElementById("status");
 box.style.display="block";
 box.className=type;
 box.textContent=message;
}

function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function downloadBytes(bytes,name,type){
 const blob=new Blob([bytes],{type});
 downloadBlob(blob,name);
}

function escapeHTML(str){
 return str
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

async function processFile(){

 const files=[...input.files];

 if(!files.length){
   status("❌ Please select a file first.","error");
   return;
 }

 const btn=document.getElementById("processBtn");
 btn.disabled=true;
 btn.textContent="Processing...";

 status("⏳ Processing your file...","info");

 try{

 switch(currentTool){

 case "pdf-to-word":
   await pdfToWord(files[0]);
   break;

 case "jpg-to-pdf":
 case "png-to-pdf":
 case "image-to-pdf":
 case "pdf-scanner":
   await imagesToPDF(files);
   break;

 case "merge-pdf":
   await mergePDF(files);
   break;

 case "split-pdf":
   await splitPDF(files[0]);
   break;

 case "extract-pages":
   await extractPages(files[0]);
   break;

 case "remove-pages":
   await removePages(files[0]);
   break;

 case "rotate-pdf":
   await rotatePDF(files[0]);
   break;

 case "jpg-to-png":
   await convertImage(files[0],"png");
   break;

 case "png-to-jpg":
 case "image-to-jpg":
   await convertImage(files[0],"jpeg");
   break;

 case "compress-image":
   await compressImage(files[0]);
   break;

 case "resize-image":
   await resizeImage(files[0]);
   break;

 default:
   status(
   "✅ File upload is working.\n\n"+
   "This tool needs a dedicated conversion engine/backend "+
   "for full processing.",
   "info"
   );

 }

 }catch(error){

 console.error(error);

 status(
 "❌ Processing failed.\n\n"+
 (error.message || error),
 "error"
 );

 }

 btn.disabled=false;
 btn.textContent="Process File";
}


/* PDF TO WORD */

async function pdfToWord(file){

 status("⏳ Reading PDF text...","info");

 const pdfjs = await import(
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
 );

 pdfjs.GlobalWorkerOptions.workerSrc =
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

 const data=await file.arrayBuffer();

 const pdf=await pdfjs.getDocument({
   data:data
 }).promise;

 let text="";

 for(let i=1;i<=pdf.numPages;i++){

   const page=await pdf.getPage(i);

   const content=await page.getTextContent();

   const pageText=content.items
     .map(item=>item.str)
     .join(" ");

   text+="Page "+i+"\n\n";
   text+=pageText+"\n\n";
 }

 if(!text.trim()){
   throw new Error(
   "No selectable text found. This may be a scanned/image PDF."
   );
 }

 const html=
 `<!DOCTYPE html>
 <html>
 <head>
 <meta charset="UTF-8">
 <style>
 body{font-family:Arial;font-size:14pt}
 </style>

 </head>
 <body>
 ${escapeHTML(text).replace(/\n/g,"<br>")}
 </body>
 </html>`;

const blob=new Blob([html],{
type:"application/msword"
});

downloadBlob(
blob,
file.name.replace(/.pdf$/i,"")+".doc"
);

status(
"✅ PDF converted successfully.\n\n"+
"Your Word-compatible .doc file has been downloaded.",
"success"
);
}

/* IMAGES TO PDF */

async function imagesToPDF(files){

const {PDFDocument}=PDFLib;

const pdf=await PDFDocument.create();

for(const file of files){

const bytes=await file.arrayBuffer();

let image;

if(file.type==="image/png"){
image=await pdf.embedPng(bytes);
}else{
image=await pdf.embedJpg(bytes);
}

const width=image.width;
const height=image.height;

const page=pdf.addPage([width,height]);

page.drawImage(image,{
x:0,
y:0,
width:width,
height:height
});
}

const bytes=await pdf.save();

downloadBytes(
bytes,
"iLovePDF4-images.pdf",
"application/pdf"
);

status(
"✅ PDF created successfully.",
"success"
);
}

/* MERGE PDF */

async function mergePDF(files){

if(files.length<2){
throw new Error("Select at least 2 PDF files to merge.");
}

const {PDFDocument}=PDFLib;

const output=await PDFDocument.create();

for(const file of files){

const bytes=await file.arrayBuffer();

const pdf=await PDFDocument.load(bytes);

const pages=await output.copyPages(
pdf,
pdf.getPageIndices()
);

pages.forEach(page=>output.addPage(page));
}

const bytes=await output.save();

downloadBytes(
bytes,
"iLovePDF4-merged.pdf",
"application/pdf"
);

status(
"✅ "+files.length+" PDF files merged successfully.",
"success"
);
}

/* SPLIT PDF */

async function splitPDF(file){

const {PDFDocument}=PDFLib;

const bytes=await file.arrayBuffer();

const source=await PDFDocument.load(bytes);

for(let i=0;i<source.getPageCount();i++){

const output=await PDFDocument.create();

const [page]=await output.copyPages(
source,
[i]
);

output.addPage(page);

const data=await output.save();

downloadBytes(
data,
"page-"+(i+1)+".pdf",
"application/pdf"
);
}

status(
"✅ PDF split successfully.\n\n"+
source.getPageCount()+" page(s) created.",
"success"
);
}

/* EXTRACT PAGES */

async function extractPages(file){

const value=document
.getElementById("pageNumbers")
.value.trim();

if(!value){
throw new Error("Enter page numbers first. Example: 1,3,5");
}

const pages=parsePageNumbers(value);

const {PDFDocument}=PDFLib;

const source=await PDFDocument.load(
await file.arrayBuffer()
);

const output=await PDFDocument.create();

const indexes=pages
.filter(n=>n>=1 && n<=source.getPageCount())
.map(n=>n-1);

if(!indexes.length){
throw new Error("No valid page numbers found.");
}

const copied=await output.copyPages(
source,
indexes
);

copied.forEach(p=>output.addPage(p));

const data=await output.save();

downloadBytes(
data,
"extracted-pages.pdf",
"application/pdf"
);

status(
"✅ Selected pages extracted successfully.",
"success"
);
}

/* REMOVE PAGES */

async function removePages(file){

const value=document
.getElementById("pageNumbers")
.value.trim();

if(!value){
throw new Error("Enter page numbers to remove.");
}

const remove=parsePageNumbers(value);

const {PDFDocument}=PDFLib;

const source=await PDFDocument.load(
await file.arrayBuffer()
);

const output=await PDFDocument.create();

for(let i=0;i<source.getPageCount();i++){

const pageNumber=i+1;

if(!remove.includes(pageNumber)){
const [page]=await output.copyPages(source,[i]);
output.addPage(page);
}
}

if(output.getPageCount()===0){
throw new Error("You cannot remove all pages.");
}

const data=await output.save();

downloadBytes(
data,
"pages-removed.pdf",
"application/pdf"
);

status(
"✅ Selected pages removed successfully.",
"success"
);
}

/* PAGE NUMBER PARSER */

function parsePageNumbers(value){

const result=[];

value.split(",").forEach(part=>{

part=part.trim();

if(part.includes("-")){

```
 const [a,b]=part.split("-").map(Number);

 if(Number.isInteger(a)&&Number.isInteger(b)){

   for(let i=a;i<=b;i++){
     result.push(i);
   }

 }
```

}else{

```
 const n=Number(part);

 if(Number.isInteger(n)){
   result.push(n);
 }
```

}

});

return [...new Set(result)].sort((a,b)=>a-b);
}

/* ROTATE PDF */

async function rotatePDF(file){

const {PDFDocument,degrees}=PDFLib;

const pdf=await PDFDocument.load(
await file.arrayBuffer()
);

pdf.getPages().forEach(page=>{
page.setRotation(
degrees((page.getRotation().angle+90)%360)
);
});

const bytes=await pdf.save();

downloadBytes(
bytes,
"rotated.pdf",
"application/pdf"
);

status(
"✅ PDF rotated successfully.",
"success"
);
}

/* IMAGE CONVERSION */

async function convertImage(file,format){

const img=new Image();

const url=URL.createObjectURL(file);

await new Promise((resolve,reject)=>{

img.onload=resolve;
img.onerror=reject;
img.src=url;

});

const canvas=document.createElement("canvas");

canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;

const ctx=canvas.getContext("2d");

if(format==="jpeg"){
ctx.fillStyle="#ffffff";
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);
}

ctx.drawImage(
img,
0,
0
);

const mime=
format==="png"
? "image/png"
: "image/jpeg";

const blob=await new Promise(resolve=>
canvas.toBlob(
resolve,
mime,
.92
)
);

downloadBlob(
blob,
file.name.replace(/.[^.]+$/,"")+"."+(
format==="png"?"png":"jpg"
)
);

URL.revokeObjectURL(url);

status(
"✅ Image converted successfully.",
"success"
);
}

/* COMPRESS IMAGE */

async function compressImage(file){

const img=new Image();

const url=URL.createObjectURL(file);

await new Promise((resolve,reject)=>{

img.onload=resolve;
img.onerror=reject;
img.src=url;

});

const canvas=document.createElement("canvas");

canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0
);

const blob=await new Promise(resolve=>
canvas.toBlob(
resolve,
"image/jpeg",
.65
)
);

downloadBlob(
blob,
"compressed-"+file.name.replace(
/.[^.]+$/,
".jpg"
)
);

URL.revokeObjectURL(url);

status(
"✅ Image compressed successfully.",
"success"
);
}

/* RESIZE IMAGE */

async function resizeImage(file){

const img=new Image();

const url=URL.createObjectURL(file);

await new Promise((resolve,reject)=>{

img.onload=resolve;
img.onerror=reject;
img.src=url;

});

const width=Math.round(img.naturalWidth*.5);
const height=Math.round(img.naturalHeight*.5);

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

const blob=await new Promise(resolve=>
canvas.toBlob(
resolve,
"image/jpeg",
.9
)
);

downloadBlob(
blob,
"resized-"+file.name.replace(
/.[^.]+$/,
".jpg"
)
);

URL.revokeObjectURL(url);

status(
"✅ Image resized to 50% successfully.",
"success"
);
}

/* LOGOUT */

async function logout(){

try{

await fetch(
"/api/logout",
{method:"POST"}
);

}catch(e){}

location.href="/login.html";
}

</script>

</body>
</html>
