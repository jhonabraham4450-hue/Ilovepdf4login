<header>

    <a href="home.html" class="logo">

<main class="container">

  <div class="card">

    <div class="icon">
      📝

    <h1>Word to PDF</h1>

    <p class="description">
      Convert your Word document into a PDF file.
    </p>


    <div class="upload-box">

      <p>
        Select a Word document to convert
      </p>

      <label for="fileInput" class="select-btn">
        Select Word File
      </label>

      <input
        id="fileInput"
        type="file"
        accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      >

      <div id="fileName" class="file-name">
        No file selected
      </div>

    </div>


    <button
      id="processBtn"
      class="process-btn"
      disabled
    >
      Convert to PDF
    </button>


    <div id="status" class="status"></div>

    <div id="downloadArea" class="download-area"></div>

  </div>

</main>


<footer>

  <p>
    <strong>iLovePDF4</strong>
  </p>

  <p style="margin-top:8px;">
    Word to PDF Converter
  </p>

  <p style="margin-top:12px;">

  </p>

</footer>


<script>

const fileInput =
  document.getElementById("fileInput");

const fileName =
  document.getElementById("fileName");

const processBtn =
  document.getElementById("processBtn");

const statusBox =
  document.getElementById("status");

const downloadArea =
  document.getElementById("downloadArea");


let selectedFile = null;


/* =========================
   FILE SELECT
========================= */

fileInput.addEventListener("change", function(){

  const file = fileInput.files[0];

  selectedFile = null;

  downloadArea.innerHTML = "";
  statusBox.textContent = "";

  if(!file){

    fileName.textContent =
      "No file selected";

    processBtn.disabled = true;

    return;
  }


  const fileNameLower =
    file.name.toLowerCase();

  const isWord =
    fileNameLower.endsWith(".doc") ||
    fileNameLower.endsWith(".docx");


  if(!isWord){

    fileName.textContent =
      "Please select a Word file.";

    statusBox.textContent =
      "Only DOC and DOCX files are supported.";

    processBtn.disabled = true;

    return;
  }


  selectedFile = file;

  fileName.textContent =
    file.name;

  statusBox.textContent =
    "Word file selected. Ready to convert.";

  processBtn.disabled = false;

});


/* =========================
   CONVERT BUTTON
========================= */

processBtn.addEventListener("click", async function(){

  if(!selectedFile){

    statusBox.textContent =
      "Please select a Word file first.";

    return;
  }


  processBtn.disabled = true;

  downloadArea.innerHTML = "";

  try{

    await startConversion(selectedFile);

  }catch(error){

    console.error(error);

    statusBox.textContent =
      "Error: " +
      (error.message ||
       "Conversion failed.");

    processBtn.disabled = false;

  }

});


/* =========================
   START CONVERSION
========================= */

async function startConversion(file){

  statusBox.textContent =
    "Uploading file to CloudConvert...";


  const formData =
    new FormData();

  formData.append(
    "file",
    file,
    file.name
  );

  formData.append(
    "tool",
    "word-to-pdf"
  );


  const response =
    await fetch(
      "/api/convert-start",
      {
        method:"POST",
        credentials:"include",
        body:formData
      }
    );


  const responseText =
    await response.text();


  let data;

  try{

    data =
      JSON.parse(responseText);

  }catch(error){

    throw new Error(
      responseText ||
      "Invalid server response."
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Unable to start conversion."
    );

  }


  if(!data.jobId){

    throw new Error(
      "CloudConvert job ID was not returned."
    );

  }


  statusBox.textContent =
    "Conversion started. Please wait...";


  await pollConversion(data.jobId);

}


/* =========================
   CHECK CONVERSION STATUS
========================= */

async function pollConversion(jobId){

  const maxAttempts = 120;


  for(
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ){

    await new Promise(
      resolve =>
        setTimeout(resolve,2000)
    );


    const response =
      await fetch(
        "/api/convert-status?job=" +
        encodeURIComponent(jobId) +
        "&v=" +
        Date.now(),
        {
          method:"GET",
          credentials:"include",
          cache:"no-store",
          headers:{
            "Cache-Control":"no-cache",
            "Pragma":"no-cache"
          }
        }
      );


    const responseText =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(responseText);

    }catch(error){

      throw new Error(
        "Invalid conversion status response."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        "Unable to check conversion status."
      );

    }


    if(
      data.status === "finished" ||
      data.status === "completed"
    ){

      const downloadUrl =
        data.downloadUrl ||
        data.url ||
        data.resultUrl;


      if(!downloadUrl){

        throw new Error(
          "Conversion finished but download link is missing."
        );

      }


      const link =
        document.createElement("a");


      link.href =
        downloadUrl;

      link.className =
        "download";

      link.textContent =
        "Download PDF File";

      link.target =
        "_blank";

      link.rel =
        "noopener";


      downloadArea.innerHTML = "";

      downloadArea.appendChild(link);


      statusBox.textContent =
        "Conversion completed successfully.";

      processBtn.disabled =
        false;

      return;

    }


    if(
      data.status === "error" ||
      data.status === "failed"
    ){

      throw new Error(
        data.error ||
        data.message ||
        "CloudConvert conversion failed."
      );

    }


    statusBox.textContent =
      "Converting... Please wait. (" +
      attempt +
      "/" +
      maxAttempts +
      ")";

  }


  throw new Error(
    "Conversion timed out. Please try again."
  );

}

</script>
